<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodFusion | Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px 8%;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: bold;
        }

        .address-label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 15px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111827;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>FoodFusion</h1>
        <p>Secure Checkout</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Delivery Details</h2>

            <form method="POST">

                {% csrf_token %}

                <label class="address-label">
                    Delivery Address
                </label>

                <textarea
                    name="delivery_address"
                    placeholder="Enter your complete delivery address"
                    required
                >{{ delivery_address|default:'' }}</textarea>

                <button
                    type="submit"
                    class="btn"
                >
                    Place Order
                </button>

            </form>

            <a href="{% url 'cart' %}" class="back">
                ← Back to Cart
            </a>

        </div>

        <div class="card">

            <h2>Order Summary</h2>

            {% for item_id, details in cart.items %}

            <div class="item">

                <div>
                    <div class="item-name">
                        {{ details.item.name }}
                    </div>

                    <div>
                        {{ details.quantity }} × ₹{{ details.item.price }}
                    </div>
                </div>

                <strong>
                    ₹{{ details.subtotal }}
                </strong>

            </div>

            {% endfor %}

            <div class="total">
                <span>Total</span>
                <span>₹{{ totalCost }}</span>
            </div>

        </div>

    </div>

</body>
</html>
